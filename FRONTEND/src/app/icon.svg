<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Shield / Crest Background in Deep Forest Ink -->
  <rect width="100" height="100" rx="22" fill="#071512" />
  
  <!-- Outer Warm Gold Accent Border -->
  <rect x="4" y="4" width="92" height="92" rx="18" stroke="#d97706" stroke-width="2.5" fill="none" opacity="0.8" />

  <!-- Top Diamond Facet -->
  <polygon points="50,16 41,27 50,38 59,27" stroke="#dc2626" stroke-width="3.6" stroke-linejoin="round" fill="#990000" fill-opacity="0.3"/>

  <!-- Main Gothic Arch Outer Boundary -->
  <path d="M 50,16 C 40,26 28,36 28,54 L 28,76 L 50,83 L 72,76 L 72,54 C 72,36 60,26 50,16 Z" stroke="#dc2626" stroke-width="4.2" stroke-linejoin="round" fill="#0c231e"/>

  <!-- Outer Wing Steps -->
  <path d="M 28,36 L 20,40 L 20,68 L 28,72" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 72,36 L 80,40 L 80,68 L 72,72" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Central Book Spine & Open Pages -->
  <path d="M 23,80 L 50,85 L 77,80" stroke="#f59e0b" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 50,85 L 50,56" stroke="#f59e0b" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Dynamic Inner Facet Lines -->
  <path d="M 41,27 L 35,53 L 50,57 L 65,53 L 59,27" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 35,53 L 28,60 L 50,70 L 72,60 L 65,53" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 50,38 L 50,56" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
</svg>

